name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  scenarios-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Scenario fixtures
        run: make scenarios-check

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest
      - name: Pytest with .env.example only (X2)
        run: |
          set -a
          eval "$(grep -v '^#' .env.example | grep '=' | sed 's/^/export /')"
          set +a
          pytest
      - name: Langfuse SDK compat (C10c)
        run: |
          pip install -e ".[tracing]"
          pytest tests/triage/test_tracing_sdk_compat.py

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: OpenAPI drift
        run: python scripts/export_openapi.py --check

  boot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Prepare env
        run: |
          cp .env.example .env.local
          printf '\nGROK_CLIENT=fixture\nGROK_FIXTURE_PATH=\nMCP_ADAPTER_TOKEN=ci-boot-smoke-token\nAUTO_RESOLVE_ENABLED=1\nSTREAM_RATE_PER_MIN=60\n' >> .env.local
      - name: Compose up and health
        run: |
          # Hold the worker back until the seed is triaged: its stream fixture
          # client has no response for SPL-2026-0001 and would send it to review.
          docker compose --env-file .env.local -f deploy/compose.yml up -d --build --wait --scale triage_worker=0
          make health
      - name: Triage seed
        run: |
          set -o pipefail
          COMPOSE_PROGRESS=quiet docker compose --env-file .env.local -f deploy/compose.yml --profile tools run --rm -T \
            -e GROK_FIXTURE_PATH=/app/tests/triage/fixtures/grok_seed_ok.json \
            triage 2>triage.stderr | tee triage.json || { cat triage.stderr; exit 1; }
          python scripts/assert_seed_triaged.py triage.json
      - name: Start triage worker
        run: docker compose --env-file .env.local -f deploy/compose.yml up -d --wait --scale triage_worker=1 triage_worker
      - name: Health fails when SOAR is down
        run: |
          set -o pipefail
          docker compose --env-file .env.local -f deploy/compose.yml stop mock_soar
          if HEALTH_TIMEOUT_S=5 make health 2>&1 | tee health-soar-down.txt; then
            echo "expected health to fail when mock_soar is stopped" >&2
            exit 1
          fi
          grep -q 'FAIL soar' health-soar-down.txt
          docker compose --env-file .env.local -f deploy/compose.yml start mock_soar
          make health
      - name: Public gateway exposes MCP only
        run: |
          set -a && . ./.env.local && set +a
          docker compose --env-file .env.local -f deploy/compose.yml exec -T case_api python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          public_port = os.environ.get("PUBLIC_GATEWAY_PORT", "8081")
          local_port = os.environ.get("GATEWAY_PORT", "8080")
          def fetch(url: str, *, headers: dict[str, str] | None = None) -> int:
              req = urllib.request.Request(url, headers=headers or {})
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.getcode() or 0
              except urllib.error.HTTPError as exc:
                  return exc.code

          assert fetch(f"http://nginx:{public_port}/case/v1/cases") == 404
          assert fetch(f"http://nginx:{public_port}/splunk/v1/alerts") == 404
          init = json.dumps(
              {
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": "initialize",
                  "params": {
                      "protocolVersion": "2025-03-26",
                      "capabilities": {},
                      "clientInfo": {"name": "ci", "version": "0"},
                  },
              }
          ).encode()
          mcp_req = urllib.request.Request(
              f"http://nginx:{public_port}/mcp",
              data=init,
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json, text/event-stream",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(mcp_req) as resp:
                  mcp_code = resp.getcode() or 0
          except urllib.error.HTTPError as exc:
              mcp_code = exc.code
          assert mcp_code == 401
          assert fetch(f"http://nginx:{local_port}/case/v1/cases") == 200
          assert fetch(f"http://nginx:{public_port}/console/") == 404
          assert fetch(f"http://nginx:{public_port}/case/v1/metrics") == 404
          PY
      - name: Console on local gateway
        run: |
          set -a && . ./.env.local && set +a
          docker compose --env-file .env.local -f deploy/compose.yml exec -T case_api python - <<'PY'
          import os
          import urllib.request

          port = os.environ.get("GATEWAY_PORT", "8080")
          with urllib.request.urlopen(f"http://nginx:{port}/console/") as resp:
              body = resp.read().decode("utf-8")
              assert resp.getcode() == 200, resp.getcode()
          assert "LEGION Command Center" in body
          PY
      - name: Stream and metrics smoke
        run: |
          set -a && . ./.env.local && set +a
          base="${PUBLIC_BASE_URL:-http://localhost:8080}"
          base="${base%/}"
          curl -f --max-time 30 -X POST "${base}/splunk/v1/stream/stop" \
            -H 'content-type: application/json' -d '{}' || true
          curl -f --max-time 30 -X POST "${base}/splunk/v1/stream/start" \
            -H 'content-type: application/json' -d '{"mode":"random"}'
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          base = os.environ.get("PUBLIC_BASE_URL", "http://localhost:8080").rstrip("/")
          deadline = time.time() + 120
          last: dict[str, object] | None = None
          while time.time() < deadline:
              with urllib.request.urlopen(f"{base}/case/v1/metrics", timeout=30) as resp:
                  last = json.loads(resp.read().decode("utf-8"))
              counts = last.get("counts", {}) if isinstance(last, dict) else {}
              total = int(counts.get("total", 0))
              auto_resolved = int(counts.get("auto_resolved", 0))
              if total >= 3 and auto_resolved >= 1:
                  print(json.dumps(counts))
                  raise SystemExit(0)
              time.sleep(5)
          print(
              f"stream metrics smoke timed out: {json.dumps(last)}",
              file=sys.stderr,
          )
          raise SystemExit(1)
          PY
          curl -f --max-time 30 -X POST "${base}/splunk/v1/stream/stop" \
            -H 'content-type: application/json' -d '{}'
      - name: Reset stores
        run: |
          set -a && . ./.env.local && set +a
          # Remove the worker so it cannot re-triage the seed after reset.
          docker compose --env-file .env.local -f deploy/compose.yml up -d --scale triage_worker=0 triage_worker
          make reset
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base = os.environ.get("PUBLIC_BASE_URL", "http://localhost:8080").rstrip("/")
          case_query = urllib.parse.urlencode({"limit": 50, "offset": 0})
          with urllib.request.urlopen(f"{base}/case/v1/cases?{case_query}") as resp:
              cases = json.loads(resp.read())
          assert cases.get("total") == 0, cases
          with urllib.request.urlopen(f"{base}/soar/v1/submissions?case_id=1") as resp:
              soar = json.loads(resp.read())
          assert soar.get("items") == [], soar
          seed_alert = os.environ.get("SEED_ALERT_ID", "SPL-2026-0001")
          with urllib.request.urlopen(f"{base}/splunk/v1/alerts/{seed_alert}") as resp:
              splunk = json.loads(resp.read())
          assert splunk.get("alert_id") == seed_alert, splunk
          PY
      - name: Capture compose logs on failure
        if: always()
        run: docker compose --env-file .env.local -f deploy/compose.yml --profile ngrok --profile tools logs --no-color > compose.log || true
      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-log
          path: compose.log
      - name: Compose down
        if: always()
        run: make down
