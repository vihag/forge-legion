# Variant of auto-benign-av-quarantine-download: same story, different values. Generated by tools/make_auto_variants.py.
id: auto-benign-av-quarantine-download-v2
title: "Malicious file quarantined on ${laptop.id}"
splunk_rule_name: "Malware - Malicious File Quarantined by EDR - Rule"
splunk_severity: medium
outcome_class: auto_benign
weight: 3
mitre_techniques: [T1204.002]
entities:
  user: {pick: {kind: user, where: {pool: routine, dept: wealth-management}}}
  laptop: {pick: {kind: host, where: {pool: routine, role: laptop, dept: wealth-management}}}
alert:
  title: "Malicious file quarantined on ${laptop.id}"
  description: "EDR quarantined DHL_Shipment_552190.img on write in ${user.id}'s Downloads folder. No execution was recorded."
  fields:
    user: ${user.id}
    dest: ${laptop.id}
    file_name: "DHL_Shipment_552190.img"
    file_path: "C:\\Users\\${user.id}\\Downloads\\DHL_Shipment_552190.img"
    file_hash: "c41d2e7f9a0b3c6d8e1f4a7b2c5d9e0f3a6b8c1d4e7f0a2b5c8d1e3f6a9b0c2d"
    signature: "Trojan:Win32/Qakbot.ISO!MTB"
    action: quarantined
evidence:
  - source: proxy
    sourcetype: "zscaler:web"
    offset_s: -9
    fields: {client: "${laptop.id}", user: "${user.id}", method: GET, url: "https://quickfile-transfer.example.net/s/Hk93Pz/DHL_Shipment_552190.img",
             category: "File Host", filetype: "Disk Image", action: Allowed, threat_name: "None", bytes_in: 2097152}
  - source: edr
    sourcetype: "crowdstrike:events:detection"
    offset_s: 0
    fields: {host: "${laptop.id}", user: "${user.id}", event_simpleName: QuarantinedFile, file_name: "DHL_Shipment_552190.img",
             tactic: "Execution", technique: "User Execution", severity: Medium, PatternDisposition: "Quarantined, File Write Blocked", process_executed: false}
  - source: edr
    sourcetype: "crowdstrike:events:sensor"
    offset_s: -12
    fields: {host: "${laptop.id}", event_simpleName: ProcessRollup2, image: "C:\\Program Files\\Microsoft\\Edge\\Application\\msedge.exe", parent: explorer.exe, user: "${user.id}"}
  - source: email
    sourcetype: "pps_messagelog"
    offset_s: -1940
    fields: {recipient: "${user.id}@kestrelgate.example", sender: "accounts@invoice-portal.example.com", subject: "Your parcel 552190 is on hold",
             url_count: 1, final_action: delivered, spam_score: 55, phish_score: 47}
  - source: dns
    sourcetype: "infoblox:dns"
    offset_s: 120
    fields: {src_host: "${laptop.id}", query: "update.avcloud.example", query_type: A, reply_code: NOERROR}
