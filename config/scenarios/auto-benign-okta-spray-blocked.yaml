id: auto-benign-okta-spray-blocked
title: "Password spray against SSO, 0 successes"
splunk_rule_name: "Access - Password Spraying Against Identity Provider - Rule"
splunk_severity: medium
outcome_class: auto_benign
weight: 3
demo_slot: 10
mitre_techniques: [T1110.003]
entities:
  user: {pick: {kind: user, where: {pool: routine, dept: marketing}}}
alert:
  title: "Password spray against sso.kestrelgate.example: 41 accounts, 0 successes"
  description: "203.0.113.150 attempted single passwords against 41 accounts in 9 minutes; first targeted account ${user.id}."
  fields:
    src_ip: 203.0.113.150
    src_country: NL
    user: ${user.id}
    dest: sso.kestrelgate.example
    user_count: 41
    success_count: 0
    action: failure
evidence:
  - source: auth
    sourcetype: "OktaIM2:log"
    offset_s: -540
    fields: {eventType: "user.session.start", actor: "${user.id}", outcome: FAILURE, reason: INVALID_CREDENTIALS, client_ip: 203.0.113.150, geo_country: NL,
             user_agent: "python-requests/2.31", count: 1}
  - source: auth
    sourcetype: "OktaIM2:log"
    offset_s: -5
    fields: {eventType: "security.threat.detected", client_ip: 203.0.113.150, threat_suspected: true, threat_category: "Password Spray", action: "ThreatInsight deny", distinct_users: 41}
  - source: auth
    sourcetype: "OktaIM2:log"
    offset_s: 60
    fields: {eventType: "user.session.start", client_ip: 203.0.113.150, outcome: DENY, reason: "Blocked by ThreatInsight", count: 18}
  - source: cloud
    sourcetype: "azure:aad:signin"
    offset_s: -120
    fields: {userPrincipalName: "${user.id}@kestrelgate.example", ipAddress: 203.0.113.150, clientAppUsed: "Exchange ActiveSync", status: "53003 blocked by Conditional Access (legacy auth)", resultType: 53003}
  - source: auth
    sourcetype: "OktaIM2:log"
    offset_s: -3600
    fields: {eventType: "user.session.start", actor: "${user.id}", outcome: SUCCESS, client_ip: 10.30.2.77, geo_country: SG, authenticator: "Okta Verify push"}
