# Variant of auto-benign-sanctioned-offsite-backup: same story, different values. Generated by tools/make_auto_variants.py.
id: auto-benign-sanctioned-offsite-backup-v2
title: "Large outbound transfer from ${host.id}"
splunk_rule_name: "Network - Unusually Large Outbound Data Transfer - Rule"
splunk_severity: medium
outcome_class: auto_benign
weight: 3
mitre_techniques: [T1048]
entities:
  host: {pick: {kind: host, where: {pool: routine, role: backup-media-server}}}
  svc: {pick: {kind: user, where: {pool: routine, title: "Service account (offsite backup)"}}}
alert:
  title: "Large outbound transfer from ${host.id} to backup.finvault.example"
  description: "${host.id} sent 11.8 GB to 203.0.113.81:443 in 31 minutes, 6.7x its 30-day hourly median."
  fields:
    src: ${host.id}
    src_zone: trust-servers
    dest_ip: 203.0.113.81
    dest_host: backup.finvault.example
    user: ${svc.id}
    bytes_out: 12670154342
    app: ssl
    action: allowed
evidence:
  - source: firewall
    sourcetype: "pan:traffic"
    offset_s: -1866
    fields: {src_host: "${host.id}", dest_ip: 203.0.113.81, dest_port: 443, app: ssl, rule: "BACKUP-TO-FINVAULT", action: allow,
             bytes_sent: 12670154342, bytes_received: 40112640, session_end_reason: tcp-fin, duration_s: 1862}
  - source: dns
    sourcetype: "infoblox:dns"
    offset_s: -1870
    fields: {src_host: "${host.id}", query: backup.finvault.example, query_type: A, answer: 203.0.113.81, reply_code: NOERROR}
  - source: edr
    sourcetype: "crowdstrike:events:sensor"
    offset_s: -1875
    fields: {host: "${host.id}", event_simpleName: ProcessRollup2, image: "C:\\Program Files\\FinVault\\Agent\\FinVaultAgent.exe", parent: services.exe,
             user: "${svc.id}", cmdline: "FinVaultAgent.exe --job HR-Archive-Weekly-Synthetic-Full --target backup.finvault.example", signer: "FinVault Pte Ltd (example)", signature_valid: true}
  - source: auth
    sourcetype: "WinEventLog:Security"
    offset_s: -1877
    fields: {EventCode: 4624, Computer: "${host.id}", TargetUserName: "${svc.id}", LogonType: 5}
  - source: firewall
    sourcetype: "pan:traffic"
    offset_s: -3600
    fields: {src_host: "${host.id}", dest_ip: 203.0.113.81, dest_port: 443, app: ssl, rule: "BACKUP-TO-FINVAULT", action: allow, bytes_sent: 1488977000, duration_s: 412}
