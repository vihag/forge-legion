id: auto-fp-password-typo-lockout
title: "Excessive failed logins: ${user.id}"
splunk_rule_name: "Access - Excessive Failed Logins - Rule"
splunk_severity: low
outcome_class: auto_fp
weight: 4
demo_slot: 5
mitre_techniques: [T1110.001]
entities:
  user: {pick: {kind: user, where: {pool: routine, dept: finance}}}
  ws: {pick: {kind: host, where: {pool: routine, role: workstation, dept: finance}}}
  helpdesk: {pick: {kind: user, where: {pool: routine, dept: it-servicedesk}}}
alert:
  title: "Excessive failed logins for ${user.id} on ${ws.id}"
  description: "7 failed interactive logons for ${user.id} on ${ws.id} in 3 minutes; account locked out."
  fields:
    user: ${user.id}
    src: ${ws.id}
    dest: DC-02
    count: 7
    action: failure
    signature_id: 4625
evidence:
  - source: auth
    sourcetype: "WinEventLog:Security"
    offset_s: -175
    fields: {EventCode: 4625, Computer: "${ws.id}", TargetUserName: "${user.id}", LogonType: 2, Status: "0xC000006D", SubStatus: "0xC000006A", count: 7, IpAddress: "127.0.0.1"}
  - source: auth
    sourcetype: "WinEventLog:Security"
    offset_s: -2
    fields: {EventCode: 4740, Computer: DC-02, TargetUserName: "${user.id}", CallerComputerName: "${ws.id}"}
  - source: auth
    sourcetype: "WinEventLog:Security"
    offset_s: -26100
    fields: {EventCode: 4723, Computer: DC-02, TargetUserName: "${user.id}", SubjectUserName: "${user.id}", note: "password change by account owner"}
  - source: auth
    sourcetype: "WinEventLog:Security"
    offset_s: 410
    fields: {EventCode: 4767, Computer: DC-02, TargetUserName: "${user.id}", SubjectUserName: "${helpdesk.id}"}
  - source: auth
    sourcetype: "WinEventLog:Security"
    offset_s: 455
    fields: {EventCode: 4624, Computer: "${ws.id}", TargetUserName: "${user.id}", LogonType: 2, IpAddress: "127.0.0.1"}
