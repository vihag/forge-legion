# Variant of auto-fp-vuln-scanner-sweep: same story, different values. Generated by tools/make_auto_variants.py.
id: auto-fp-vuln-scanner-sweep-v2
title: "Port sweep from internal host against ${target.id}"
splunk_rule_name: "Network - Vulnerability Scanner Detection (by targets) - Rule"
splunk_severity: low
outcome_class: auto_fp
weight: 4.5
mitre_techniques: [T1046]
entities:
  scanner: {pick: {kind: host, where: {pool: routine, role: vulnerability-scanner}}}
  svc: {pick: {kind: user, where: {pool: routine, title: "Service account (Tenable scan)"}}}
  target: {pick: {kind: host, where: {pool: routine, role: laptop}}}
alert:
  title: "Port sweep from ${scanner.id} against ${target.id}"
  description: "${scanner.id} touched 612 distinct TCP ports on ${target.id} within 3 minutes."
  fields:
    src: ${scanner.id}
    src_zone: trust-servers
    dest: ${target.id}
    user: ${svc.id}
    dest_port_count: 612
    signature: "TCP port sweep"
    action: allowed
    count: 612
evidence:
  - source: firewall
    sourcetype: "pan:traffic"
    offset_s: -170
    fields: {src_host: "${scanner.id}", src_zone: trust-servers, dest_host: "${target.id}", dest_zone: trust-users, app: incomplete,
             dest_port_range: "21-23,80,135-139,443,445,1433,5985-5986", sessions: 612, action: allow, rule: "SCANNER-TO-ALL", session_end_reason: aged-out}
  - source: auth
    sourcetype: "WinEventLog:Security"
    offset_s: -150
    fields: {EventCode: 4624, Computer: "${target.id}", TargetUserName: "${svc.id}", LogonType: 3, WorkstationName: "${scanner.id}",
             AuthenticationPackageName: NTLM, LmPackageName: "NTLM V2"}
  - source: auth
    sourcetype: "WinEventLog:Security"
    offset_s: -149
    fields: {EventCode: 5145, Computer: "${target.id}", SubjectUserName: "${svc.id}", ShareName: "\\\\*\\ADMIN$", RelativeTargetName: "tenable_wmi_probe.tmp",
             AccessMask: "0x2"}
  - source: edr
    sourcetype: "crowdstrike:events:sensor"
    offset_s: -300
    fields: {host: "${scanner.id}", event_simpleName: ProcessRollup2, image: "/opt/nessus/sbin/nessusd", parent: systemd, user: root,
             cmdline: "/opt/nessus/sbin/nessusd -q", signed: true}
  - source: dns
    sourcetype: "infoblox:dns"
    offset_s: -301
    fields: {src_host: "${scanner.id}", query: "${target.id}.corp.kestrelgate.example", query_type: A, reply_code: NOERROR}
