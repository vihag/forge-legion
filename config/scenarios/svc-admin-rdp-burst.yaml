id: svc-admin-rdp-burst
title: Privileged RDP burst
splunk_rule_name: Privileged RDP burst
splunk_severity: medium
outcome_class: hitl_confirm
weight: 10
mitre_techniques:
- T1078
entities:
  user:
    pick:
      kind: user
      where:
        privileged: true
  host:
    pick:
      kind: host
      where:
        pool: hitl
alert:
  title: Privileged RDP burst
  description: Activity for ${user.id} on ${host.id}
  fields: {}
evidence:
- source: auth
  sourcetype: WinEventLog:Security
  offset_s: -30
  fields:
    user: ${user.id}
    host: ${host.id}
- source: proxy
  sourcetype: bluecoat:proxy
  offset_s: 10
  fields:
    src_host: ${host.id}
