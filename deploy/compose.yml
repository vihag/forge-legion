services:
  case_api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../${ENV_FILE:-.env.local}
    command:
      - uvicorn
      - services.case_api.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "${CASE_API_PORT}"
    volumes:
      - forge_data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "services.healthcheck", "CASE_API_PORT"]
      interval: 3s
      retries: 20

  mock_splunk:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../${ENV_FILE:-.env.local}
    command:
      - uvicorn
      - services.mock_splunk.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "${MOCK_SPLUNK_PORT}"
    healthcheck:
      test: ["CMD", "python", "-m", "services.healthcheck", "MOCK_SPLUNK_PORT"]
      interval: 3s
      retries: 20

  mock_soar:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../${ENV_FILE:-.env.local}
    command:
      - uvicorn
      - services.mock_soar.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "${MOCK_SOAR_PORT}"
    volumes:
      - forge_data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "services.healthcheck", "MOCK_SOAR_PORT"]
      interval: 3s
      retries: 20

  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../${ENV_FILE:-.env.local}
    environment:
      MCP_ADAPTER_TOKEN: ${MCP_ADAPTER_TOKEN?}
      MCP_ALLOWED_HOSTS: "${NGROK_DOMAIN:-},${MCP_EXTRA_ALLOWED_HOSTS:-}"
      MOCK_SPLUNK_URL: ${MOCK_SPLUNK_URL}
    command:
      - uvicorn
      - services.mcp_adapter.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "${MCP_PORT}"
    healthcheck:
      test: ["CMD", "python", "-m", "services.healthcheck", "MCP_PORT"]
      interval: 3s
      retries: 20

  nginx:
    image: nginx:1.27.4-alpine
    env_file:
      - ../${ENV_FILE:-.env.local}
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      PUBLIC_GATEWAY_PORT: ${PUBLIC_GATEWAY_PORT}
      CASE_API_UPSTREAM: ${CASE_API_UPSTREAM}
      MOCK_SPLUNK_UPSTREAM: ${MOCK_SPLUNK_UPSTREAM}
      MOCK_SOAR_UPSTREAM: ${MOCK_SOAR_UPSTREAM}
      MCP_UPSTREAM: ${MCP_UPSTREAM}
      GROKBOT_CENTURION_LINK_TEMPLATE: ${GROKBOT_CENTURION_LINK_TEMPLATE:-grokbot://app/v1/agent?id=8818388d-d88b-4b48-a907-11dcc6b8547d}
    ports:
      - "${GATEWAY_BIND}:${GATEWAY_PUBLIC_PORT}:${GATEWAY_PORT}"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../console:/app/console:ro
    depends_on:
      case_api:
        condition: service_healthy
      mock_splunk:
        condition: service_healthy
      mock_soar:
        condition: service_healthy
      mcp:
        condition: service_healthy

  triage_worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PIP_EXTRAS: tracing
    env_file:
      - ../${ENV_FILE:-.env.local}
    command:
      - python
      - -m
      - services.triage
      - worker
    depends_on:
      case_api:
        condition: service_healthy
      mock_splunk:
        condition: service_healthy
    restart: unless-stopped

  triage:
    profiles:
      - tools
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PIP_EXTRAS: tracing
    env_file:
      - ../${ENV_FILE:-.env.local}
    command:
      - python
      - -m
      - services.triage
      - run
      - --alert-id
      - "${SEED_ALERT_ID}"
    depends_on:
      case_api:
        condition: service_healthy
      mock_splunk:
        condition: service_healthy

  ngrok:
    profiles:
      - ngrok
    image: ngrok/ngrok:3
    env_file:
      - ../${ENV_FILE:-.env.local}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN?}
    command:
      - http
      - --url=${NGROK_DOMAIN}
      - nginx:${PUBLIC_GATEWAY_PORT}
    depends_on:
      - nginx

volumes:
  forge_data: