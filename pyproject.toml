[project]
name = "forge-legion"
version = "0.1.0"
description = "FORGE case store and case API (/v1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "langgraph>=0.2",
    "httpx>=0.27",
    "mcp>=1.6,<2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
tracing = ["langfuse>=5.2,<6"]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff==0.17.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contracts*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call the live Grok API (not run in CI)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["contracts", "services", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["contracts", "services"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["services", "contracts"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "langgraph"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langfuse", "langfuse.*"]
ignore_missing_imports = true
